services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: CremaCRM
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'

  prom-server:
    image: prom/prometheus
    profiles:
      - monitoring
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus-config.yml:/etc/prometheus/prometheus.yml

  crm-api:
    build: ./apps/crm-api
    ports:
      - '3000:3000'
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: CremaCRM
      #UPSTASH_REDIS_URL: ${UPSTASH_REDIS_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHANNEL_STUB_URL: http://channel-stub:3001
      CRM_API_URL: http://crm-api:3000
      FRONTEND_URL: http://localhost:3002
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-chat:free}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
    depends_on:
      - postgres
      - redis

  channel-stub:
    build: ./apps/channel-stub
    ports:
      - '3001:3001'
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CRM_API_URL: http://crm-api:3000
    depends_on:
      - redis

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - '3002:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - crm-api

volumes:
  pgdata:
